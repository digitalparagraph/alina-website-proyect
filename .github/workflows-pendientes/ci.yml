name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Falla si el esquema de contenido no valida. Una página de tema sin
      # delimitación de alcance no compila: es el requisito del ADR 001
      # convertido en condición de build.
      - name: Build
        run: npm run build

      - name: Enlaces internos
        run: npm run verificar:enlaces

      # Tercer control de la Etapa 3. Valida lo que el proyecto decidió: las dos
      # credenciales de Person, que nunca se declare terapeuta (ADR 001), y que
      # el FAQPage corresponda a lo visible en la página.
      - name: Datos estructurados
        run: npm run verificar:schema
