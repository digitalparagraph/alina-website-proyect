<!-- @dsCard group="Colors" viewport="700x130" name="Semantic states" subtitle="Muted, warm state colours — never stock red/green" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--ink-900)}.sw{display:flex;gap:0}.sw div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:10px;letter-spacing:.04em}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="sw"><div style="background:var(--state-success);color:var(--ink-900)"><span style="opacity:.8">success</span></div><div style="background:var(--state-info);color:var(--ink-900)"><span style="opacity:.8">info</span></div><div style="background:var(--state-warning);color:var(--ink-900)"><span style="opacity:.8">warning</span></div><div style="background:var(--state-error);color:var(--ink-900)"><span style="opacity:.8">error</span></div></div><p class="mono">--state-success #7FA37A · --state-info var(--lilac-400) · --state-warning #E5A93F · --state-error #C46A62</p></body></html>
