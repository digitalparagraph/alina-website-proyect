<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--ink-900)}.sw{display:flex;gap:0}.sw div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:10px;letter-spacing:.04em}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><p style="font-size:13px;letter-spacing:.22em;color:var(--text-secondary);margin:0 0 10px">existir consciente</p><p style="font-size:13px;letter-spacing:.22em;color:var(--text-muted);margin:0 0 10px">sesiones · talleres · acompañamiento</p><p class="mono">--type-eyebrow + --tracking-widest (0.22em). Always lowercase.</p></body></html>
