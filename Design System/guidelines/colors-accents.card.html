<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--ink-900)}.sw{display:flex;gap:0}.sw div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:10px;letter-spacing:.04em}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="sw"><div style="background:var(--blush-100);color:var(--ink-900)"><span style="opacity:.8">blush 100</span></div><div style="background:var(--blush-300);color:var(--ink-900)"><span style="opacity:.8">300</span></div><div style="background:var(--blush-400);color:var(--ink-900)"><span style="opacity:.8">400</span></div><div style="background:var(--blush-500);color:var(--ink-900)"><span style="opacity:.8">500</span></div><div style="background:var(--sage-100);color:var(--ink-900)"><span style="opacity:.8">sage 100</span></div><div style="background:var(--sage-300);color:var(--ink-900)"><span style="opacity:.8">300</span></div><div style="background:var(--sage-400);color:var(--ink-900)"><span style="opacity:.8">400</span></div></div><p class="mono">Blush = the cheeks and small marks in the line art. Sage supports "organic" campaign layouts.</p></body></html>
