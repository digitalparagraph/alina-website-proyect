<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--ink-900)}.sw{display:flex;gap:0}.sw div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:10px;letter-spacing:.04em}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div class="sw"><div style="background:var(--ink-900);color:var(--white)"><span style="opacity:.8">900</span></div><div style="background:var(--ink-800);color:var(--white)"><span style="opacity:.8">800</span></div><div style="background:var(--ink-700);color:var(--white)"><span style="opacity:.8">700</span></div><div style="background:var(--ink-600);color:var(--white)"><span style="opacity:.8">600 · logo grey</span></div></div><div class="sw"><div style="background:var(--gray-400);color:var(--ink-900)"><span style="opacity:.8">400</span></div><div style="background:var(--gray-300);color:var(--ink-900)"><span style="opacity:.8">300</span></div><div style="background:var(--gray-200);color:var(--ink-900)"><span style="opacity:.8">200 · mist</span></div><div style="background:var(--gray-100);color:var(--ink-900)"><span style="opacity:.8">100</span></div><div style="background:var(--white);color:var(--ink-900)"><span style="opacity:.8">white</span></div></div><p class="mono">Body copy sits on --ink-800; headlines and rules use pure --ink-900.</p></body></html>
