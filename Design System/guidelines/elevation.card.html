<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--ink-900)}.sw{display:flex;gap:0}.sw div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:10px;letter-spacing:.04em}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:14px">
  <div style="flex:1;background:#fff;padding:16px;border-radius:var(--radius-md);box-shadow:var(--shadow-none);border:1px solid var(--gray-200)"><span class="mono">--shadow-none</span><br>default</div>
  <div style="flex:1;background:#fff;padding:16px;border-radius:var(--radius-md);box-shadow:var(--shadow-soft)"><span class="mono">--shadow-soft</span><br>toasts</div>
  <div style="flex:1;background:#fff;padding:16px;border-radius:var(--radius-md);box-shadow:var(--shadow-card)"><span class="mono">--shadow-card</span><br>hover panels</div>
  <div style="flex:1;background:#fff;padding:16px;border-radius:var(--radius-md);box-shadow:var(--shadow-overlay)"><span class="mono">--shadow-overlay</span><br>dialogs</div>
 </div></body></html>
