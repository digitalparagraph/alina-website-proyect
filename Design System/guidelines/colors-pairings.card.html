<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}a{color:var(--text-accent)}a:hover{color:var(--ink-900)}.sw{display:flex;gap:0}.sw div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:10px;letter-spacing:.04em}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:10px">
  <div style="flex:1;background:var(--butter-400);padding:14px;border-radius:var(--radius-md)"><b style="font-size:19px">Texto negro</b><br><span style="font-weight:300;font-size:13px">sobre mantequilla</span></div>
  <div style="flex:1;background:var(--surface-lilac);padding:14px;border-radius:var(--radius-md)"><b style="font-size:19px">Texto negro</b><br><span style="font-weight:300;font-size:13px">sobre lila claro</span></div>
  <div style="flex:1;background:var(--surface-mist);padding:14px;border-radius:var(--radius-md)"><b style="font-size:19px">Texto negro</b><br><span style="font-weight:300;font-size:13px">sobre niebla</span></div>
  <div style="flex:1;background:var(--ink-900);color:#fff;padding:14px;border-radius:var(--radius-md)"><b style="font-size:19px">Texto blanco</b><br><span style="font-weight:300;font-size:13px">sobre negro</span></div>
 </div><p class="mono">Never put lilac type on butter, or white type on butter — contrast fails.</p></body></html>
